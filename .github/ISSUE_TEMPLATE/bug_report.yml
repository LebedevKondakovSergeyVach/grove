name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. grove status
        2. grove switch 410
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `grove --version`
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Other]
    validations:
      required: true

  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: zsh 5.9

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >
        Output of `grove config show`.
        Remove anything you do not want to publish.
      render: json
