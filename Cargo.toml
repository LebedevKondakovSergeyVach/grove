[package]
name = "grove-git"
version = "0.1.0"
edition = "2024"
# CI still pins 1.88. Raise this only when a dependency requires it.
rust-version = "1.88"
authors = ["LebedevKondakovSergeyVach <sergejlebedev31838@gmail.com>"]
description = "CLI for one git workflow across a workspace of related repositories"
license = "AGPL-3.0"
repository = "https://github.com/LebedevKondakovSergeyVach/grove"
homepage = "https://github.com/LebedevKondakovSergeyVach/grove"
readme = "README.md"
keywords = ["git", "cli", "workspace"]
categories = ["command-line-utilities", "development-tools"]

# [[bin]] name is grove. The package name stays grove-git.
[[bin]]
name = "grove"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
